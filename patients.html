<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者积分 · 健康积分</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#243247;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:68px;background:white;border-bottom:1px solid #e9edf3;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-weight:700;font-size:18px}.logo{display:inline-grid;place-items:center;background:#1677ff;color:white;border-radius:10px;width:36px;height:36px;margin-right:10px}.user{color:#657388;font-size:14px}.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:210px;background:white;border-right:1px solid #e9edf3;padding:30px 16px;flex-shrink:0}.navtitle{font-size:13px;color:#9aa6b5;padding:0 14px 14px}.nav{display:block;text-decoration:none;padding:13px 14px;border-radius:8px;color:#657388}.nav.active{background:#eaf3ff;color:#1677ff;font-weight:700}main{flex:1;min-width:0;padding:32px;max-width:1800px}h1{font-size:26px;margin:0 0 8px}p{margin:0;color:#8290a2;font-size:14px;line-height:1.6}.heading{margin-bottom:24px}.panel{background:white;border:1px solid #e9eef4;border-radius:12px;box-shadow:0 4px 18px #233e5e08}.filters{padding:22px 24px;display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:8px;font-size:13px;color:#68788b}.field input,.field select,.field textarea{height:40px;border:1px solid #dce3eb;border-radius:7px;padding:0 11px;background:white;color:#34445a}.field textarea{height:75px;padding:10px;resize:vertical}.search{width:310px;max-width:100%}.btn{border-radius:8px;padding:10px 17px;font-size:14px;font-weight:600}.primary{background:#1677ff;color:white;border:1px solid #1677ff}.secondary{background:white;color:#46556a;border:1px solid #dce3eb}.btn:disabled{opacity:.5;cursor:not-allowed}.tablewrap{overflow:auto;margin:0 24px}table{width:100%;min-width:1050px;border-collapse:collapse;font-size:14px}th{text-align:left;background:#f7f9fc;color:#7b899a;font-weight:500}td,th{padding:16px 12px;border-bottom:1px solid #eef1f5;white-space:nowrap}td{color:#36465a}td:last-child,th:last-child{position:sticky;right:0;background:#fff;z-index:2;box-shadow:-5px 0 12px #2432470d}th:last-child{background:#f7f9fc}.totalpoints{color:#1677ff;font-weight:700}.link{border:0;background:none;color:#1677ff;padding:4px}.foot{padding:20px 26px;color:#8b98a8;font-size:13px}.empty{text-align:center;padding:45px;color:#9aa6b5}dialog{border:0;border-radius:14px;padding:0;width:min(570px,calc(100% - 30px));max-height:90vh;box-shadow:0 20px 80px #102b4c33}dialog::backdrop{background:#15253b80}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #edf0f5;font-size:18px;font-weight:700}.close{border:0;background:none;font-size:24px;color:#98a5b4}.modalbody{padding:24px;overflow:auto;max-height:calc(90vh - 142px)}.modalfoot{padding:16px 24px;border-top:1px solid #edf0f5;display:flex;justify-content:flex-end;gap:10px}.drawer{position:fixed;inset:0 0 0 auto;margin:0;max-height:100vh;height:100vh;width:min(680px,100%);border-radius:0;overflow:hidden}.drawer[open]{display:flex;flex-direction:column}.drawer .modalbody{overflow:auto;max-height:none;flex:1;background:#f7f9fc}.drawer .modalfoot,.drawer .modalhead{background:#fff}.card{background:#fff;border:1px solid #e9eef4;border-radius:10px;padding:20px;margin-bottom:14px}.card h3{font-size:15px;margin:0 0 16px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#f4f8ff;border-radius:9px;padding:18px}.summary span,.kv span{display:block;color:#8996a7;font-size:13px;margin-bottom:8px}.summary strong{font-size:22px}.summary>div:last-child strong{color:#1677ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kv{font-size:14px;line-height:1.5}.full{width:100%}.form{display:grid;gap:16px}.notice{background:#fff8e9;color:#94671e;border-radius:8px;padding:12px;font-size:13px;line-height:1.6}.bluebox{background:#f1f7ff;color:#3d618a;border-radius:8px;padding:12px;font-size:13px;line-height:1.7}.error{color:#d45042;font-size:13px}.mini-table{width:100%;min-width:0}.mini-table td,.mini-table th{padding:10px 5px;white-space:normal;font-size:13px}.mini-table td:last-child,.mini-table th:last-child{position:static;box-shadow:none}.pos{color:#19865b}.neg{color:#e07142}.detail-filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.detail-filter select,.detail-filter input{border:1px solid #dce3eb;border-radius:6px;padding:7px;font-size:13px}.family-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:14px}.family-row:last-child{border:0}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#243247;color:white;border-radius:8px;padding:12px 20px;z-index:20}@media(max-width:700px){aside{display:none}main{padding:18px}.summary{gap:5px}.summary strong{font-size:18px}}
</style></head><body><header><div class="brand"><span class="logo">✚</span>数字化慢病管理助手</div><div class="user">健康积分管理　·　医护人员</div></header><div class="layout"><aside><div class="navtitle">健康积分</div><a class="nav" href="index.html">▤　订单管理</a><div class="nav active">♙　患者积分</div><div class="nav">◇　商品管理</div><div class="nav">⚙　积分规则</div></aside><main><div class="heading"><h1>患者积分</h1><p>查询患者积分、补录线下任务，并为患者代兑换商品</p></div><section class="panel"><div class="filters"><label class="field">搜索患者<input class="search" id="search" placeholder="患者姓名/身份证/手机号"></label><button class="btn primary" onclick="render()">查询</button><button class="btn secondary" onclick="document.getElementById('search').value='';render()">重置</button></div><div class="tablewrap"><table><thead><tr><th>序号</th><th>患者姓名</th><th>患者身份证</th><th>患者手机号</th><th>本人积分</th><th>其他成员积分</th><th>可用积分</th><th>操作</th></tr></thead><tbody id="list"></tbody></table><div id="empty" class="empty" hidden>暂无符合条件的患者</div></div><div class="foot" id="total"></div></section></main></div><dialog id="modal"><div class="modalhead"><span id="modalTitle"></span><button class="close" onclick="modal.close()" aria-label="关闭">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></dialog><script>
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),now=()=>new Date().toLocaleString('zh-CN',{hour12:false});
const seed=[{id:'p1',name:'张秀兰',idcard:'330106195801012318',phone:'13800002801',balance:100,family:[{name:'张建国',relation:'配偶',balance:80,authorized:true}],records:[{time:'2026-11-18 09:30',type:'兑换扣减',title:'兑换电子血压计',amount:-100},{time:'2026-11-10 10:00',type:'任务获得',title:'上传居家监测数据',amount:1}]},{id:'p2',name:'李建国',idcard:'330106196502021234',phone:'13900001126',balance:120,family:[],records:[{time:'2026-11-17 14:20',type:'任务获得',title:'完成年度体检',amount:40}]},{id:'p3',name:'王丽',idcard:'330106197003034567',phone:'13600006302',balance:260,family:[{name:'李明',relation:'配偶',balance:60,authorized:true},{name:'李小雨',relation:'子女',balance:30,authorized:false}],records:[]},{id:'p4',name:'周明',idcard:'330106196804042345',phone:'13500004568',balance:45,family:[],records:[]}];
let patients=JSON.parse(localStorage.getItem('doctorPatientsDemo')||'null')||seed,current=null;const tasks=[{id:'lecture',name:'参加线下健康讲座',points:5,limit:3},{id:'vaccination',name:'完成预防接种',points:20,limit:1}];const products=[{id:'bp',name:'电子血压计',points:180,stock:12},{id:'kit',name:'低钠健康礼包',points:80,stock:20},{id:'tcm',name:'中医理疗服务',points:120,stock:null}];let inventory=JSON.parse(localStorage.getItem('doctorInventoryDemo')||'null')||Object.fromEntries(products.map(x=>[x.id,x.stock]));
function save(){localStorage.setItem('doctorPatientsDemo',JSON.stringify(patients));localStorage.setItem('doctorInventoryDemo',JSON.stringify(inventory))}function maskId(v){return v.slice(0,6)+'******'+v.slice(-4)}function maskPhone(v){return v.slice(0,3)+'****'+v.slice(-4)}function familyTotal(p){return p.family.filter(f=>f.authorized).reduce((s,f)=>s+f.balance,0)}function available(p){return p.balance+familyTotal(p)}function patient(id){return patients.find(p=>p.id===id)}function escapeText(s){let el=document.createElement('div');el.textContent=String(s);return el.innerHTML}function flash(s){let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
function render(){let q=$('search').value.trim().toLowerCase(),found=patients.filter(p=>[p.name,p.idcard,p.phone].some(x=>x.toLowerCase().includes(q)));$('list').innerHTML=found.map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>${maskId(p.idcard)}</td><td>${maskPhone(p.phone)}</td><td>${p.balance}</td><td>${familyTotal(p)}</td><td class="totalpoints">${available(p)}</td><td><button class="link" onclick="detail('${p.id}')">详情</button><button class="link" onclick="supplement('${p.id}')">积分补录</button><button class="link" onclick="redeem('${p.id}')">代兑换</button></td></tr>`).join('');$('empty').hidden=!!found.length;$('total').textContent=`共 ${found.length} 位患者`}
function show(title,body,foot,drawer=false){modal.classList.toggle('drawer',drawer);$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=foot;modal.showModal()}const close='<button class="btn secondary" onclick="modal.close()">关闭</button>';function backToDetail(){modal.close();detail(current)}
function detail(id){current=id;let p=patient(id);let members=p.family.filter(f=>f.authorized);show('患者积分详情',`<div class="card"><div class="grid" style="margin-bottom:18px"><div class="kv"><span>患者姓名</span>${p.name}</div><div class="kv"><span>患者身份证</span>${maskId(p.idcard)}</div><div class="kv"><span>患者手机号</span>${maskPhone(p.phone)}</div></div><div class="summary"><div><span>本人积分</span><strong>${p.balance}</strong></div><div><span>其他成员积分</span><strong>${familyTotal(p)}</strong></div><div><span>可用积分</span><strong>${available(p)}</strong></div></div><p style="margin-top:12px">可用积分 = 本人积分 + 已授权其他成员积分</p></div><div class="card"><h3>家庭积分</h3>${members.length?members.map(f=>`<div class="family-row"><span>${escapeText(f.name)} · ${escapeText(f.relation)}（已授权）</span><strong>${f.balance} 积分</strong></div>`).join(''):'<p>暂无已授权家庭成员</p>'}<p style="margin-top:10px">仅展示已授权可共同兑换的成员。</p></div><div class="card"><h3>积分明细</h3><div class="detail-filter"><select id="recordType" onchange="renderRecords()"><option value="">全部类型</option><option>任务获得</option><option>医护补录</option><option>手动调整</option><option>兑换扣减</option><option>取消退回</option><option>积分过期</option></select><input type="date" id="recordStart" aria-label="开始日期" onchange="renderRecords()"><input type="date" id="recordEnd" aria-label="结束日期" onchange="renderRecords()"></div><div id="records"></div></div><div class="card"><h3>兑换记录</h3><div id="patientOrders"></div></div>`,`${close}<button class="btn secondary" onclick="modal.close();adjust('${id}')">手动调整</button><button class="btn secondary" onclick="modal.close();supplement('${id}')">积分补录</button><button class="btn primary" onclick="modal.close();redeem('${id}')">代兑换</button>`,true);renderRecords();renderPatientOrders(p)}
function renderRecords(){let p=patient(current),type=$('recordType').value,start=$('recordStart').value,end=$('recordEnd').value;let rows=p.records.filter(r=>(!type||r.type===type)&&(!start||r.time.slice(0,10)>=start)&&(!end||r.time.slice(0,10)<=end)).sort((a,b)=>b.time.localeCompare(a.time));$('records').innerHTML=rows.length?`<table class="mini-table"><thead><tr><th>时间</th><th>事项 / 来源</th><th>积分</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeText(r.time)}</td><td>${escapeText(r.title)}<br><span style="color:#99a5b3">${escapeText(r.type)}${r.operator?' · '+escapeText(r.operator):''}${r.reason?' · '+escapeText(r.reason):''}</span></td><td class="${r.amount>=0?'pos':'neg'}">${r.amount>0?'+':''}${r.amount}</td></tr>`).join('')}</tbody></table>`:'<p>暂无符合条件的积分明细</p>'}
function renderPatientOrders(p){let os=JSON.parse(localStorage.getItem('doctorOrdersDemo')||'null')||[];let rows=os.filter(o=>o.name===p.name);$('patientOrders').innerHTML=rows.length?rows.map(o=>`<div class="family-row"><span>${escapeText(o.product)} · ${escapeText(o.date)}</span><span>${({pending:'待核销',done:'已完成',cancelled:'已取消',expired:'已过期'})[o.status]||''}</span></div>`).join('')+'<p style="margin-top:10px"><a href="index.html">前往订单管理查看</a></p>':'<p>暂无兑换记录</p>'}
function supplement(id){current=id;let p=patient(id);show('积分补录',`<div class="form"><div class="bluebox">患者：${p.name}　${maskPhone(p.phone)}　·　本人积分 ${p.balance}</div><label class="field">线下任务<select id="task" onchange="taskPreview()"><option value="">请选择任务</option>${tasks.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></label><label class="field">完成日期<input id="taskDate" type="date" value="${today()}" max="${today()}" onchange="taskPreview()"></label><div id="taskPreview"></div><label class="field">备注（可选）<textarea id="taskNote" maxlength="200" placeholder="填写补录说明"></textarea></label><div id="err" class="error"></div></div>`,`${close}<button class="btn primary" onclick="saveSupplement()">确认补录</button>`)}
function taskCount(p,t,year){return p.records.filter(r=>r.taskId===t.id&&String(r.completedDate||'').startsWith(year)).length}function taskPreview(){let t=tasks.find(x=>x.id===$('task').value),date=$('taskDate').value,p=patient(current);$('taskPreview').innerHTML=t&&date?`<div class="bluebox">奖励 +${t.points} 积分 · 每年最多 ${t.limit} 次<br>${date.slice(0,4)} 年已补录 ${taskCount(p,t,date.slice(0,4))} 次，剩余 ${Math.max(0,t.limit-taskCount(p,t,date.slice(0,4)))} 次</div>`:''}function saveSupplement(){let p=patient(current),t=tasks.find(x=>x.id===$('task').value),date=$('taskDate').value;if(!t||!date){$('err').textContent='请选择任务和完成日期';return}if(date>today()){$('err').textContent='完成日期不能晚于今天';return}if(taskCount(p,t,date.slice(0,4))>=t.limit){$('err').textContent='该任务已达到年度次数上限';return}p.balance+=t.points;p.records.unshift({time:now(),type:'医护补录',title:t.name,amount:t.points,operator:'当前医护',reason:$('taskNote').value.trim(),taskId:t.id,completedDate:date});save();modal.close();render();flash('补录成功，积分已增加')}
function adjust(id){current=id;let p=patient(id);show('手动调整积分',`<div class="form"><div class="bluebox">患者：${p.name}　·　本人可用积分 ${p.balance}<br>手动调整仅影响患者本人积分。</div><label class="field">调整方式<select id="direction"><option value="add">增加积分</option><option value="subtract">扣减积分</option></select></label><label class="field">调整积分<input id="amount" type="number" min="1" step="1" placeholder="请输入正整数"></label><label class="field">调整原因<textarea id="reason" maxlength="200" placeholder="请填写调整原因"></textarea></label><div id="err" class="error"></div></div>`,`${close}<button class="btn primary" onclick="previewAdjust()">下一步</button>`)}
function previewAdjust(){let p=patient(current),n=Number($('amount').value),reason=$('reason').value.trim(),d=$('direction').value;if(!Number.isSafeInteger(n)||n<=0||!reason){$('err').textContent='请输入正整数积分并填写调整原因';return}if(d==='subtract'&&n>p.balance){$('err').textContent='本人积分不足，扣减后不能为负数';return}let delta=d==='add'?n:-n;modal.close();show('确认积分调整',`<div class="bluebox">患者：${p.name}<br>调整：${delta>0?'+':''}${delta} 积分<br>调整前：${p.balance}　→　调整后：${p.balance+delta}<br>原因：${escapeText(reason)}</div>`,`${close}<button class="btn primary" id="confirmAdjust">确认调整</button>`);$('confirmAdjust').onclick=()=>{if(delta<0&&p.balance+delta<0){flash('本人积分不足');return}let before=p.balance;p.balance+=delta;p.records.unshift({time:now(),type:'手动调整',title:delta>0?'手动增加积分':'手动扣减积分',amount:delta,operator:'当前医护',reason,before,after:p.balance});save();modal.close();render();flash('积分调整成功')}}
function allocations(p,amount,order){let list=order==='family'?[...p.family.filter(f=>f.authorized),p]:[p,...p.family.filter(f=>f.authorized)],remaining=amount,result=[];for(let m of list){let n=Math.min(m.balance,remaining);if(n>0){result.push({member:m,amount:n,name:m===p?'本人':m.name});remaining-=n}if(!remaining)break}return result}
function redeem(id){current=id;let p=patient(id);show('代患者兑换',`<div class="form"><div class="bluebox">患者：${p.name}　·　本人 ${p.balance} + 其他成员 ${familyTotal(p)} = 可用 ${available(p)} 积分</div><label class="field">商品名称<select id="product" onchange="redeemPreview()"><option value="">请选择商品</option>${products.map(x=>`<option value="${x.id}">${x.name} · ${x.points} 积分</option>`).join('')}</select></label><label class="field">积分扣减顺序<select id="priority" onchange="redeemPreview()"><option value="personal">先扣本人，再按家庭成员顺序</option><option value="family">先扣家庭成员，再扣本人</option></select></label><div id="preview"></div><div class="notice">请确认商品或服务已当场交付，提交后将直接完成核销。</div><div id="err" class="error"></div></div>`,`${close}<button class="btn primary" onclick="previewRedeem()">下一步</button>`)}
function redeemPreview(){let p=patient(current),item=products.find(x=>x.id===$('product').value);if(!item){$('preview').innerHTML='';return}let stock=inventory[item.id],split=allocations(p,item.points,$('priority').value);$('preview').innerHTML=`<div class="bluebox">${stock===null?'服务不限库存':'剩余库存：'+stock}<br>${available(p)<item.points?'可用积分不足，还差 '+(item.points-available(p))+' 积分':'预计扣减：'+split.map(x=>escapeText(x.name)+' '+x.amount+' 积分').join('、')}</div>`}
function previewRedeem(){let p=patient(current),item=products.find(x=>x.id===$('product').value),priority=$('priority').value;if(!item){$('err').textContent='请选择商品';return}if(available(p)<item.points){$('err').textContent='可用积分不足，无法兑换';return}if(inventory[item.id]!==null&&inventory[item.id]<=0){$('err').textContent='库存不足，无法兑换';return}let split=allocations(p,item.points,priority);modal.close();show('确认兑换并核销',`<div class="bluebox">患者：${p.name}<br>商品：${item.name}<br>消耗：${item.points} 积分<br>扣减来源：${split.map(x=>escapeText(x.name)+' '+x.amount+' 积分').join('、')}<br>兑换后可用积分：${available(p)-item.points}</div><div class="notice" style="margin-top:16px">确认商品或服务已当场交付，订单将直接完成核销。</div>`,`${close}<button class="btn primary" id="confirmRedeem">确认兑换并核销</button>`);$('confirmRedeem').onclick=()=>{if(available(p)<item.points||(inventory[item.id]!==null&&inventory[item.id]<=0)){flash('积分或库存不足，请重新操作');return}let fresh=allocations(p,item.points,priority);fresh.forEach(x=>x.member.balance-=x.amount);if(inventory[item.id]!==null)inventory[item.id]--;let timestamp=now(),id='R'+Date.now(),splitText=fresh.map(x=>x.name+' '+x.amount+' 积分').join('、');p.records.unshift({time:timestamp,type:'兑换扣减',title:'代兑换'+item.name,amount:-(fresh.find(x=>x.member===p)?.amount||0),operator:'当前医护',reason:'扣减来源：'+splitText});let stored=JSON.parse(localStorage.getItem('doctorOrdersDemo')||'null');if(!stored){stored=[{id:'R20261118001',code:'HX26111801',name:'张秀兰',phone:'138****2801',product:'电子血压计',type:'实物商品',points:180,center:'仓前街道社区卫生服务中心',source:'患者自助',date:'2026-11-18 09:30',status:'pending',until:'2026-12-18',split:'本人 100 积分、家庭成员 80 积分'},{id:'R20261117002',code:'HX26111702',name:'李建国',phone:'139****1126',product:'中医理疗服务',type:'健康服务',points:120,center:'仓前街道社区卫生服务中心',source:'患者自助',date:'2026-11-17 14:20',status:'pending',until:'2026-12-17',split:'本人 120 积分'},{id:'R20261116003',code:'',name:'王丽',phone:'136****6302',product:'低钠健康礼包',points:80,center:'仓前街道社区卫生服务中心',source:'医护代兑换',date:'2026-11-16 10:25',status:'d

:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#243247;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:68px;background:white;border-bottom:1px solid #e9edf3;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-weight:700;font-size:18px}.logo{display:inline-grid;place-items:center;background:#1677ff;color:white;border-radius:10px;width:36px;height:36px;margin-right:10px}.user{color:#657388;font-size:14px}.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:210px;background:white;border-right:1px solid #e9edf3;padding:30px 16px;flex-shrink:0}.navtitle{font-size:13px;color:#9aa6b5;padding:0 14px 14px}.nav{padding:13px 14px;border-radius:8px;color:#657388}.nav.active{background:#eaf3ff;color:#1677ff;font-weight:700}main{flex:1;min-width:0;padding:32px;max-width:1800px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:26px;margin:0 0 8px}p{margin:0;color:#8290a2;font-size:14px}.primary{background:#1677ff;color:white;border:1px solid #1677ff}.btn{border-radius:8px;padding:10px 17px;font-size:14px;font-weight:600}.secondary{background:white;color:#46556a;border:1px solid #dce3eb}.panel{background:white;border:1px solid #e9eef4;border-radius:12px;box-shadow:0 4px 18px #233e5e08}.tabs{display:flex;gap:28px;padding:0 24px;border-bottom:1px solid #edf0f5;overflow:auto}.tab{border:0;background:none;padding:19px 0;color:#718096;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:#1677ff;border-color:#1677ff;font-weight:700}.count{font-size:12px;margin-left:4px}.filters{padding:22px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:7px;font-size:13px;color:#68788b}.field input,.field select{height:38px;border:1px solid #dce3eb;border-radius:7px;padding:0 10px;background:white;color:#3444 </style></head><body><header><div class="brand"><span class="logo">✚</span>数字化慢病管理助手</div><div class="user">健康积分管理　·　医护人员</div></header><div class="layout"><aside><div class="navtitle">健康积分</div><div class="nav active">▤　订单管理</div><div class="nav">♙　患者积分</div><div class="nav">◇　商品管理</div><div class="nav">⚙　积分规则</div></aside><main><div class="heading"><div><h1>订单管理</h1><p>查看兑换订单，核销患者领取的商品或服务</p></div><button class="btn primary" onclick="openVerify()">⌗　核销订单</button></div><section class="panel"><div class="tabs" id="tabs"></div><div class="filters"><label class="field">搜索订单<input id="keyword" placeholder="姓名 / 手机号 / 订单号 / 兑换码"></label><label class="field">商品名称<input id="goods" placeholder="输入商品或服务名称"></label><label class="field">兑换来源<select id="source"><option value="">全部来源</option><option>患者自助</option><option>医护代兑换</option></select></label><label class="field">开始日期<input id="start" type="date"></label><label class="field">结束日期<input id="end" type="date"></label><button class="btn primary" onclick="render()">查询</button><button class="btn secondary" onclick="resetFilters()">重置</button></div><div class="tablewrap"><table><thead><tr><th>订单编号</th><th>患者</th><th>商品 / 服务</th><th>兑换积分</th><th>领取社区</th><th>兑换来源</th><th>兑换时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="list"></tbody></table><div class="empty" id="empty" hidden>暂无符合条件的订单</div></div><div class="foot" id="total"></div></section></main></div><dialog id="modal"><div class="modalhead"><span id="modalTitle"></span><button class="close" onclick="modal.close()" aria-label="关闭">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></dialog><script>
const initial=[{id:'R20261118001',code:'HX26111801',name:'张秀兰',phone:'138****2801',product:'电子血压计',type:'实物商品',points:180,center:'仓前街道社区卫生服务中心',source:'患者自助',date:'2026-11-18 09:30',status:'pending',until:'2026-12-18',split:'本人 100 积分、家庭成员 80 积分'}, {id:'R20261117002',code:'HX26111702',name:'李建国',phone:'139****1126',product:'中医理疗服务',type:'健康服务',points:120,center:'仓前街道社区卫生服务中心',source:'患者自助',date:'2026-11-17 14:20',status:'pending',until:'2026-12-17',split:'本人 120 积分'}, {id:'R20261116003',code:'',name:'王丽',phone:'136****6302',product:'低钠健康礼包',type:'实物商品',points:80,center:'仓前街道社区卫生服务中心',source:'医护代兑换',date:'2026-11-16 10:25',status:'done',verified:'2026-11-16 10:25',operator:'陈医生',split:'本人 80 积分'}, {id:'R20261110004',code:'HX26111004',name:'周明',phone:'135****4568',product:'血糖仪',type:'实物商品',points:200,center:'仓前街道社区卫生服务中心',source:'患者自助',date:'2026-11-10 11:05',status:'cancelled',split:'本人 200 积分',reason:'患者取消兑换'}, {id:'R20261001005',code:'HX26100105',name:'陈芳',phone:'137****7712',product:'健康管理服务',type:'健康服务',points:100,center:'仓前街道社区卫生服务中心',source:'患者自助',date:'2026-10-01 08:20',status:'expired',until:'2026-10-31',split:'本人 100 积分'}];let orders=JSON.parse(localStorage.getItem('doctorOrdersDemo')||'null')||initial,active='pending',selected=null;const labels={pending:'待核销',done:'已完成',cancelled:'已取消',expired:'已过期'};const $=id=>document.getElementById(id);function save(){localStorage.setItem('doctorOrdersDemo',JSON.stringify(orders))}function render(){ $('tabs').innerHTML=['pending','done','cancelled','expired','all'].map(s=>`<button class="tab ${active===s?'active':''}" onclick="active='${s}';render()">${s==='all'?'全部订单':labels[s]} <span class="count">${s==='all'?orders.length:orders.filter(o=>o.status===s).length}</span></button>`).join('');let kw=$('keyword').value.trim().toLowerCase(),g=$('goods').value.trim(),src=$('source').value,start=$('start').value,end=$('end').value;let found=orders.filter(o=>(active==='all'||o.status===active)&&(!kw||[o.id,o.name,o.phone,o.code].some(x=>x.toLowerCase().includes(kw)))&&o.product.includes(g)&&(!src||o.source===src)&&(!start||o.date.slice(0,10)>=start)&&(!end||o.date.slice(0,10)<=end));$('list').innerHTML=found.map(o=>`<tr><td>${o.id}</td><td>${o.name}<div class="small">${o.phone}</div></td><td>${o.product}<div class="small">${o.type} · ×1</div></td><td>${o.points} 积分</td><td>${o.center}</td><td>${o.source}</td><td>${o.date}</td><td><span class="badge ${o.status}">${labels[o.status]}</span></td><td><button class="link" onclick="detail('${o.id}')">详情</button>${o.status==='pending'?`<button class="link" onclick="cancelOrder('${o.id}')">取消兑换</button>`:''}</td></tr>`).join('');$('empty').hidden=!!found.length;$('total').textContent=`共 ${found.length} 条订单　 ·　演示数据仅保存在本机浏览器`};function resetFilters(){['keyword','goods','source','start','end'].forEach(x=>$(x).value='');render()}function show(title,body,foot){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=foot;modal.showModal()}const closeBtn='<button class="btn secondary" onclick="modal.close()">关闭</button>';function detail(id){let o=orders.find(x=>x.id===id);let info=[['订单编号',o.id],['订单状态',labels[o.status]],['患者',o.name+'　'+o.phone],['商品 / 服务',o.product+' ×1'],['兑换积分',o.points+' 积分'],['积分扣减来源',o.split],['领取社区',o.center],['兑换来源',o.source],['兑换时间',o.date],['核销时间',o.verified||'—'],['操作人',o.operator||'—'],['领取截止',o.until||'—']];show('订单详情',`<div class="rows">${info.map(([a,b])=>`<div><span>${a}</span>${b}</div>`).join('')}</div>${o.status==='pending'?'<div class="notice">请在有效期内领取。逾期未领取，积分不退还。</div>':''}<div class="timeline">${o.status==='cancelled'?'取消原因：'+(o.reason||'患者取消兑换')+' · 积分按原账户退回':o.status==='expired'?'订单已过期 · 积分不退还':o.status==='done'?'已完成核销':'等待患者到社区领取'}</div>`,closeBtn+(o.status==='pending'?`<button class="btn primary" onclick="modal.close();openVerify('${o.code}')">核销订单</button>`:''))}function openVerify(code=''){show('核销订单',`<div class="seg"><button class="btn secondary" onclick="scanTip()">⌗　扫码核销</button><button class="btn secondary" onclick="document.getElementById('verifyCode').focus()">输入兑换码</button></div><p id="scanTip">扫码入口预留，后续接入扫码设备；当前可手动输入兑换码。</p><label class="field" style="margin-top:20px">兑换码<input class="full" id="verifyCode" placeholder="输入患者端显示的兑换码，例如 HX26111801" value="${code}"></label><div id="verifyResult"></div>`,`${closeBtn}<button class="btn primary" onclick="findCode()">查找订单</button>`)}function scanTip(){$('scanTip').textContent='扫码设备尚未接入，请先手动输入患者端兑换码。'}function findCode(){let code=$('verifyCode').value.trim().toUpperCase(),o=orders.find(x=>x.code&&x.code.toUpperCase()===code);if(!o){$('verifyResult').innerHTML='<div class="error">未找到该兑换码，请核对后重试。</div>';return}if(o.status!=='pending'){$('verifyResult').innerHTML=`<div class="error">该订单${labels[o.status]}，无法核销。</div>`;return}selected=o.id;$('verifyResult').innerHTML=`<div class="rows"><div><span>患者</span>${o.name}　${o.phone}</div><div><span>商品 / 服务</span>${o.product} ×1</div><div><span>领取社区</span>${o.center}</div><div><span>兑换积分</span>${o.points} 积分</div></div><div class="notice">请确认患者已领取商品或使用服务。核销不会再次扣除积分。</div>`;$('modalFoot').innerHTML=`${closeBtn}<button class="btn primary" onclick="verify()">确认核销</button>`}function verify(){let o=orders.find(x=>x.id===selected);if(!o||o.status!=='pending')return;o.status='done';o.verified=new Date().toLocaleString('zh-CN',{hour12:false});o.operator='当前医护';save();modal.close();active='done';render();alert('核销成功')}function cancelOrder(id){let o=orders.find(x=>x.id===id);selected=id;show('取消兑换',`<p>确认取消 ${o.name} 的「${o.product}」兑换？</p><div class="notice" style="margin-top:16px">取消后 ${o.points} 积分将按原扣减账户退回，有限库存恢复。</div><label class="field" style="margin-top:18px">取消原因<select id="reason" class="full"><option value="">请选择原因</option><option>患者要求取消</option><option>商品缺货</option><option>其他</option></select></label>`,`${closeBtn}<button class="btn primary" onclick="confirmCancel()">确认取消</button>`)}function confirmCancel(){let reason=$('reason').value;if(!reason){alert('请选择取消原因');return}let o=orders.find(x=>x.id===selected);o.status='cancelled';o.reason=reason;o.operator='当前医护';save();modal.close();active='cancelled';render()}render();
</script><style>
table{min-width:1400px} .range-wrap{position:relative}.range-trigger{height:38px;min-width:230px;text-align:left;background:#fff;border:1px solid #dce3eb;border-radius:7px;padding:0 10px;color:#718096}.range-pop{position:absolute;top:44px;left:0;z-index:4;background:white;padding:16px;border:1px solid #e4eaf1;border-radius:10px;box-shadow:0 12px 30px #233e5e20;width:275px}.range-pop label{display:block;margin-bottom:10px}.range-pop input{display:block;width:100%;margin-top:5px}.range-actions{display:flex;justify-content:flex-end;gap:8px}.drawer{position:fixed;inset:0 0 0 auto;margin:0;max-height:100vh;height:100vh;width:min(620px,100%);border-radius:0;overflow:hidden}.drawer[open]{display:flex;flex-direction:column}.drawer .modalbody{overflow-y:auto;flex:1;background:#f7f9fc}.drawer .modalhead,.drawer .modalfoot{background:white;flex-shrink:0}.summary-card,.detail-section{background:white;border:1px solid #e9eef4;border-radius:10px;padding:20px;margin-bottom:14px}.summary-top{display:flex;justify-content:space-between;align-items:center}.summary-product{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:18px;background:#f4f8ff;border-radius:8px;font-size:18px;font-weight:700}.summary-product strong{color:#1677ff}.detail-section h3{font-size:15px;margin:0 0 16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.detail-item span{display:block;color:#8996a7;font-size:13px;margin-bottom:6px}.detail-item{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.event{border-left:2px solid #dce8f7;padding:0 0 18px 16px;margin-left:5px;color:#43546b;font-size:14px;position:relative}.event:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#1677ff;left:-6px;top:4px}.event small{display:block;color:#99a5b3;margin-top:5px}.event:last-child{padding-bottom:0}.section-notice{margin-top:15px}
</style><script>
// 演示资料补齐：完整号码仅用于本地搜索，界面始终脱敏显示。
const demoIdentity={'张秀兰':['330106195801012318','13800002801'],'李建国':['330106196502021234','13900001126'],'王丽':['330106197003034567','13600006302'],'周明':['330106196804042345','13500004568'],'陈芳':['330106197205054321','13700007712']};
orders.forEach(o=>{const d=demoIdentity[o.name]||[];o.idcard=o.idcard||d[0]||'';o.fullPhone=o.fullPhone||d[1]||'';o.address=o.address||'杭州市余杭区文一西路 1500 号';});
active='all';
document.querySelector('.filters').innerHTML=`<label class="field">搜索订单<input id="keyword" placeholder="患者姓名/订单号/身份证/手机号"></label><label class="field">商品名称<input id="goods" placeholder="请输入商品名称"></label><label class="field">兑换来源<select id="source"><option value="">全部来源</option><option>患者自助</option><option>医护代兑换</option></select></label><div class="field range-wrap">兑换时间<button class="range-trigger" type="button" id="rangeLabel" onclick="toggleRange()">请选择时间范围　⌄</button><div class="range-pop" id="rangePop" hidden><label>开始日期<input id="start" type="date"></label><label>结束日期<input id="end" type="date"></label><div class="range-actions"><button class="btn secondary" onclick="clearRange()">清空</button><button class="btn primary" onclick="applyRange()">确定</button></div></div></div><button class="btn primary" onclick="render()">查询</button><button class="btn secondary" onclick="resetFilters()">重置</button>`;
document.querySelector('thead tr').innerHTML='<th>序号</th><th>订单编号</th><th>患者姓名</th><th>患者身份证</th><th>患者手机号</th><th>商品名称</th><th>兑换积分</th><th>领取社区</th><th>兑换来源</th><th>兑换时间</th><th>状态</th><th>操作</th>';
function maskId(v){return v?v.slice(0,6)+'******'+v.slice(-4):'—'}
function toggleRange(){$('rangePop').hidden=!$('rangePop').hidden}
function applyRange(){let a=$('start').value,b=$('end').value;if(a&&b&&a>b){alert('开始日期不能晚于结束日期');return}$('rangeLabel').textContent=a||b?`${a||'不限'} 至 ${b||'不限'}`:'请选择时间范围　⌄';$('rangePop').hidden=true;render()}
function clearRange(){$('start').value='';$('end').value='';applyRange()}
render=function(){ $('tabs').innerHTML=['all','pending','done','cancelled','expired'].map(s=>`<button class="tab ${active===s?'active':''}" onclick="active='${s}';render()">${s==='all'?'全部订单':labels[s]} <span class="count">${s==='all'?orders.length:orders.filter(o=>o.status===s).length}</span></button>`).join('');let kw=$('keyword').value.trim().toLowerCase(),g=$('goods').value.trim(),src=$('source').value,start=$('start').value,end=$('end').value;let found=orders.filter(o=>(active==='all'||o.status===active)&&(!kw||[o.id,o.name,o.phone,o.fullPhone,o.idcard].some(x=>(x||'').toLowerCase().includes(kw)))&&o.product.includes(g)&&(!src||o.source===src)&&(!start||o.date.slice(0,10)>=start)&&(!end||o.date.slice(0,10)<=end)).sort((a,b)=>b.date.localeCompare(a.date));$('list').innerHTML=found.map((o,i)=>`<tr><td>${i+1}</td><td>${o.id}</td><td>${o.name}</td><td>${maskId(o.idcard)}</td><td>${o.phone}</td><td>${o.product}</td><td>${o.points}</td><td>${o.center}</td><td>${o.source}</td><td>${o.date}</td><td><span class="badge ${o.status}">${labels[o.status]}</span></td><td><button class="link" onclick="detail('${o.id}')">详情</button>${o.status==='pending'?`<button class="link" onclick="cancelOrder('${o.id}')">取消兑换</button>`:''}</td></tr>`).join('');$('empty').hidden=!!found.length;$('total').textContent=`共 ${found.length} 条订单　 ·　演示数据仅保存在本机浏览器`};
